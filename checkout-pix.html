<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout PIX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .checkout-container {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #f0f0f0;
        }

        .header h2 {
            color: #333;
            font-weight: 700;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: #666;
            font-size: 0.95rem;
        }

        /* Seção de Preço */
        .price-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1.5rem;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 2rem;
        }

        .price-label {
            font-size: 0.9rem;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }

        .price-value {
            font-size: 2.5rem;
            font-weight: 700;
        }

        /* Seção PIX */
        .pix-section {
            text-align: center;
            margin-bottom: 2rem;
        }

        .pix-icon {
            font-size: 3rem;
            color: #667eea;
            margin-bottom: 1rem;
        }

        .pix-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 1rem;
        }

        .qr-code-container {
            background: #f9f9f9;
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .qr-code-placeholder {
            text-align: center;
            color: #999;
        }

        .qr-code-placeholder i {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.3;
        }

        #qrCode {
            max-width: 100%;
            height: auto;
        }

        .copy-section {
            margin-bottom: 1.5rem;
        }

        .copy-label {
            font-size: 0.85rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
            display: block;
        }

        .pix-key-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .pix-key {
            background: #f5f5f5;
            border: 1px solid #ddd;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            flex: 1;
            word-break: break-all;
            user-select: all;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .pix-key:hover {
            background: #f0f0f0;
            border-color: #667eea;
        }

        .copy-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .copy-btn:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .copy-btn.copied {
            background: #28c45c;
        }

        /* Timer */
        .timer-section {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            display: none;
        }

        .timer-section.active {
            display: block;
        }

        .timer-text {
            font-size: 0.9rem;
            color: #856404;
            margin-bottom: 0.5rem;
        }

        .timer {
            font-size: 1.5rem;
            font-weight: 700;
            color: #d39e00;
            font-family: 'Courier New', monospace;
        }

        /* Status */
        .status-section {
            background: #d4edda;
            border-left: 4px solid #28c45c;
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            display: none;
        }

        .status-section.active {
            display: block;
        }

        .status-icon {
            font-size: 2rem;
            color: #28c45c;
            margin-bottom: 0.5rem;
        }

        .status-text {
            font-size: 1rem;
            font-weight: 600;
            color: #155724;
        }

        /* Botões */
        .btn-section {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn-primary {
            background: #667eea;
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .btn-primary:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e9ecef;
            color: #333;
            border: none;
            padding: 1rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .btn-secondary:hover {
            background: #dee2e6;
        }

        /* Loading spinner */
        .spinner {
            display: none;
            text-align: center;
        }

        .spinner.active {
            display: block;
        }

        .spinner i {
            font-size: 2rem;
            color: #667eea;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .checkout-container {
                padding: 1.5rem;
                margin: 1rem;
            }

            .header h2 {
                font-size: 1.5rem;
            }

            .price-value {
                font-size: 2rem;
            }

            .btn-section {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="checkout-container">
        <!-- Header -->
        <div class="header">
            <h2>Confirmar Pagamento</h2>
            <p>Escaneie o QR Code ou copie a chave PIX</p>
        </div>

        <!-- Preço -->
        <div class="price-section">
            <div class="price-label">Total a pagar</div>
            <div class="price-value" id="displayAmount">R$ 0,00</div>
        </div>

        <!-- Status de Carregamento -->
        <div class="spinner" id="loadingSpinner">
            <i class="fas fa-spinner"></i>
            <p style="margin-top: 1rem; color: #666;">Gerando código PIX...</p>
        </div>

        <!-- Conteúdo PIX -->
        <div id="pixContent" style="display: none;">
            <!-- QR Code -->
            <div class="pix-section">
                <div class="pix-icon">
                    <i class="fas fa-qrcode"></i>
                </div>
                <div class="pix-title">Escaneie o QR Code</div>
                <div class="qr-code-container">
                    <div id="qrCodeElement" class="qr-code-placeholder">
                        <i class="fas fa-mobile-alt"></i>
                        <p>QR Code será gerado aqui</p>
                    </div>
                </div>
            </div>

            <!-- Copia e Cola -->
            <div class="copy-section">
                <label class="copy-label">
                    <i class="fas fa-copy"></i> Ou copie a chave PIX
                </label>
                <div class="pix-key-container">
                    <div class="pix-key" id="pixKey" title="Clique para copiar">
                        Carregando...
                    </div>
                    <button class="copy-btn" id="copyBtn" onclick="copyPixKey()">
                        <i class="fas fa-copy"></i> Copiar
                    </button>
                </div>
            </div>

            <!-- Timer -->
            <div class="timer-section" id="timerSection">
                <div class="timer-text">Código expira em:</div>
                <div class="timer" id="timerDisplay">30:00</div>
            </div>

            <!-- Status de Pagamento -->
            <div class="status-section" id="statusSection">
                <div class="status-icon">
                    <i class="fas fa-check-circle"></i>
                </div>
                <div class="status-text">Pagamento confirmado!</div>
            </div>

            <!-- Botões -->
            <div class="btn-section">
                <button class="btn-primary" id="confirmBtn" onclick="checkPaymentStatus()">
                    <i class="fas fa-check"></i> Já Paguei
                </button>
                <button class="btn-secondary" id="cancelBtn" onclick="goBack()">
                    <i class="fas fa-arrow-left"></i> Voltar
                </button>
            </div>
        </div>
    </div>

    <!-- Biblioteca QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        // =================================================================
        // CONFIGURAÇÃO
        // =================================================================

        let currentPaymentId = null;
        let pixCheckInterval = null;
        let expirationTime = null;
        let timerInterval = null;

        // Parâmetros da URL
        function getUrlParams() {
            const params = {};
            const urlParams = new URLSearchParams(window.location.search);
            for (const [key, value] of urlParams) {
                params[key] = value;
            }
            return params;
        }

        // Formatar valor para moeda
        function formatCurrency(value) {
            return new Intl.NumberFormat('pt-BR', {
                style: 'currency',
                currency: 'BRL'
            }).format(value);
        }

        // =================================================================
        // GERAR PAGAMENTO PIX
        // =================================================================

        async function createPixPayment() {
            const params = getUrlParams();
            const amount = parseFloat(params.amount || '0');
            const orderId = params.orderId || `ORDER_${Date.now()}`;
            const customerName = params.customerName || 'Cliente';
            const customerEmail = params.customerEmail || '';
            const description = params.description || 'Pagamento de compra';

            if (!amount || amount <= 0) {
                document.getElementById('loadingSpinner').style.display = 'none';
                alert('Valor inválido. Por favor, volte e tente novamente.');
                return;
            }

            try {
                const response = await fetch('/api/createPixPayment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        amount,
                        orderId,
                        customerName,
                        customerEmail,
                        description
                    })
                });

                const data = await response.json();

                if (data.success) {
                    currentPaymentId = data.paymentId;
                    expirationTime = new Date(data.expiresAt);

                    // Atualizar UI
                    document.getElementById('displayAmount').textContent = formatCurrency(amount);
                    document.getElementById('pixKey').textContent = data.pixCopyPaste;

                    // Gerar QR Code a partir do que a Skale devolveu
                    generateQRCode(data.qrCode, data.pixCopyPaste);

                    // Mostrar conteúdo PIX
                    document.getElementById('loadingSpinner').style.display = 'none';
                    document.getElementById('pixContent').style.display = 'block';
                    document.getElementById('timerSection').classList.add('active');

                    // Iniciar timer
                    startTimer();

                    // Começar a verificar pagamento
                    startPaymentCheck();

                    console.log('✅ Pagamento PIX criado:', currentPaymentId);
                } else {
                    throw new Error(data.erro || 'Erro ao criar pagamento');
                }
            } catch (error) {
                console.error('❌ Erro:', error);
                document.getElementById('loadingSpinner').style.display = 'none';
                alert('Erro ao gerar código PIX: ' + error.message);
            }
        }

        // =================================================================
        // GERAR QR CODE
        // =================================================================

        // qrCodeImage: PNG que a própria Skale devolve (preferido).
        // brcode: código EMV real, usado para desenhar o QR se a imagem faltar.
        function generateQRCode(qrCodeImage, brcode) {
            const container = document.getElementById('qrCodeElement');
            container.innerHTML = '';

            if (qrCodeImage && qrCodeImage.startsWith('data:image')) {
                const img = document.createElement('img');
                img.src = qrCodeImage;
                img.alt = 'QR Code do PIX';
                img.style.width = '250px';
                img.style.height = '250px';
                container.appendChild(img);
                return;
            }

            try {
                new QRCode(container, {
                    text: brcode,
                    width: 250,
                    height: 250,
                    colorDark: '#000000',
                    colorLight: '#ffffff',
                    correctLevel: QRCode.CorrectLevel.H
                });
            } catch (e) {
                // Sem QR não há como escanear, mas o copia-e-cola segue válido.
                container.innerHTML = `
                    <div style="text-align: center; color: #666;">
                        <i class="fas fa-qrcode" style="font-size: 3rem; opacity: 0.5;"></i>
                        <p>Use o código PIX copia e cola abaixo</p>
                    </div>
                `;
            }
        }

        // =================================================================
        // TIMER
        // =================================================================

        function startTimer() {
            timerInterval = setInterval(() => {
                const now = new Date();
                const diff = expirationTime - now;

                if (diff <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('timerSection').classList.remove('active');
                    document.getElementById('pixContent').innerHTML += `
                        <div style="background: #f8d7da; border-left: 4px solid #f5c6cb; padding: 1rem; border-radius: 8px; margin-top: 1rem;">
                            <p style="color: #721c24; font-weight: 600; margin: 0;">
                                <i class="fas fa-exclamation-circle"></i> Código PIX expirado
                            </p>
                        </div>
                    `;
                    return;
                }

                const minutes = Math.floor(diff / 60000);
                const seconds = Math.floor((diff % 60000) / 1000);

                document.getElementById('timerDisplay').textContent =
                    `${minutes}:${seconds.toString().padStart(2, '0')}`;
            }, 1000);
        }

        // =================================================================
        // VERIFICAR PAGAMENTO
        // =================================================================

        function startPaymentCheck() {
            pixCheckInterval = setInterval(checkPaymentStatus, 3000);
        }

        async function checkPaymentStatus() {
            if (!currentPaymentId) return;

            try {
                const response = await fetch(`/api/getPixPayment?id=${currentPaymentId}`);
                const data = await response.json();

                if (data.success && data.status === 'CONFIRMED') {
                    clearInterval(pixCheckInterval);
                    clearInterval(timerInterval);

                    document.getElementById('timerSection').classList.remove('active');
                    document.getElementById('statusSection').classList.add('active');
                    document.getElementById('confirmBtn').disabled = true;
                    document.getElementById('cancelBtn').textContent = 'Continuar';

                    console.log('✅ Pagamento confirmado!');

                    setTimeout(() => {
                        const params = getUrlParams();
                        if (params.returnUrl) {
                            window.location.href = params.returnUrl;
                        } else {
                            window.location.href = 'aprovado.html?' + new URLSearchParams(params).toString();
                        }
                    }, 2000);
                }
            } catch (error) {
                console.error('Erro ao verificar pagamento:', error);
            }
        }

        // =================================================================
        // COPIAR PIX
        // =================================================================

        function copyPixKey() {
            const pixKey = document.getElementById('pixKey').textContent;

            navigator.clipboard.writeText(pixKey).then(() => {
                const btn = document.getElementById('copyBtn');
                const originalText = btn.innerHTML;

                btn.innerHTML = '<i class="fas fa-check"></i> Copiado!';
                btn.classList.add('copied');

                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                alert('Erro ao copiar: ' + err);
            });
        }

        // =================================================================
        // NAVEGAÇÃO
        // =================================================================

        function goBack() {
            if (document.getElementById('statusSection').classList.contains('active')) {
                const params = getUrlParams();
                window.location.href = params.returnUrl || 'aprovado.html';
            } else {
                window.history.back();
            }
        }

        // =================================================================
        // INICIALIZAÇÃO
        // =================================================================

        document.addEventListener('DOMContentLoaded', () => {
            console.log('🔄 Inicializando checkout PIX...');
            createPixPayment();
        });
    </script>
</body>
</html>
