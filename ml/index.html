<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aguarde...</title>
    
    <!-- Scripts de rastreamento -->
    
    
    <script src="https://cdn.trackernexus.app/t.js" data-id="serasa-ofert" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #fffcf5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Confetes animados - Amarelos */
        .confetti-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 2px;
            opacity: 0;
            animation: confetti-fall linear forwards;
        }

        .confetti:nth-child(1) { left: 5%; animation-duration: 3.2s; animation-delay: 0.1s; background: #ffe600; }
        .confetti:nth-child(2) { left: 15%; animation-duration: 2.8s; animation-delay: 0.4s; background: #ffd700; }
        .confetti:nth-child(3) { left: 25%; animation-duration: 3.5s; animation-delay: 0.7s; background: #ffed4a; }
        .confetti:nth-child(4) { left: 35%; animation-duration: 3.0s; animation-delay: 0.2s; background: #ffe600; }
        .confetti:nth-child(5) { left: 45%; animation-duration: 3.8s; animation-delay: 0.6s; background: #ffd700; }
        .confetti:nth-child(6) { left: 55%; animation-duration: 2.9s; animation-delay: 0.3s; background: #ffed4a; }
        .confetti:nth-child(7) { left: 65%; animation-duration: 3.3s; animation-delay: 0.8s; background: #ffe600; }
        .confetti:nth-child(8) { left: 75%; animation-duration: 3.6s; animation-delay: 0.5s; background: #ffd700; }
        .confetti:nth-child(9) { left: 85%; animation-duration: 2.7s; animation-delay: 0.9s; background: #ffed4a; }
        .confetti:nth-child(10) { left: 95%; animation-duration: 3.4s; animation-delay: 0.2s; background: #ffe600; }
        .confetti:nth-child(11) { left: 10%; animation-duration: 3.1s; animation-delay: 0.5s; background: #ffd700; }
        .confetti:nth-child(12) { left: 20%; animation-duration: 3.7s; animation-delay: 0.3s; background: #ffed4a; }
        .confetti:nth-child(13) { left: 30%; animation-duration: 2.9s; animation-delay: 0.7s; background: #ffe600; }
        .confetti:nth-child(14) { left: 40%; animation-duration: 3.4s; animation-delay: 0.1s; background: #ffd700; }
        .confetti:nth-child(15) { left: 50%; animation-duration: 3.2s; animation-delay: 0.6s; background: #ffed4a; }
        .confetti:nth-child(16) { left: 60%; animation-duration: 3.6s; animation-delay: 0.4s; background: #ffe600; }
        .confetti:nth-child(17) { left: 70%; animation-duration: 2.8s; animation-delay: 0.8s; background: #ffd700; }
        .confetti:nth-child(18) { left: 80%; animation-duration: 3.3s; animation-delay: 0.2s; background: #ffed4a; }
        .confetti:nth-child(19) { left: 90%; animation-duration: 3.5s; animation-delay: 0.5s; background: #ffe600; }
        .confetti:nth-child(20) { left: 98%; animation-duration: 3.0s; animation-delay: 0.9s; background: #ffd700; }

        @keyframes confetti-fall {
            0% {
                transform: translateY(-20vh) rotate(0deg) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
                transform: translateY(-10vh) rotate(45deg) scale(1);
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(720deg) scale(0.5);
                opacity: 0;
            }
        }

        /* Container Principal */
        .container {
            max-width: 420px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 48px 32px 40px;
            text-align: center;
            box-shadow: 
                0 20px 60px rgba(255, 230, 0, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 230, 0, 0.20);
            position: relative;
            z-index: 1;
            transition: all 0.3s ease;
        }

        .container::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 42px;
            padding: 2px;
            background: linear-gradient(135deg, #ffe600, #ffed4a, #ffd700, #ffe600);
            background-size: 300% 300%;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            z-index: -1;
            animation: border-glow 3s ease-in-out infinite;
        }

        @keyframes border-glow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* Spinner Principal */
        .spinner-wrapper {
            width: 110px;
            height: 110px;
            margin: 0 auto 24px;
            position: relative;
        }

        .spinner-ring {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid #fff3d6;
            border-top-color: #ffe600;
            border-right-color: #ffd700;
            animation: spin 1.2s cubic-bezier(0.6, 0, 0.4, 1) infinite;
            transition: all 0.5s ease;
        }

        .spinner-ring.complete {
            border: 4px solid #ffe600;
            animation: none;
            background: #ffe600;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .spinner-ring.complete::after {
            content: '✓';
            font-size: 48px;
            color: #333;
            font-weight: 300;
            animation: check-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes check-pop {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .spinner-ring::after {
            content: '';
            position: absolute;
            inset: 12px;
            border-radius: 50%;
            border: 3px solid #fff3d6;
            border-bottom-color: #ffe600;
            border-left-color: #ffed4a;
            animation: spin-reverse 0.9s cubic-bezier(0.6, 0, 0.4, 1) infinite;
            transition: all 0.5s ease;
        }

        .spinner-ring.complete::after {
            content: '✓';
            position: static;
            border: none;
            animation: check-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-size: 48px;
            color: #333;
            font-weight: 300;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes spin-reverse {
            to { transform: rotate(-360deg); }
        }

        /* Dots pulsantes - Amarelos */
        .spinner-dots {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            transition: opacity 0.5s ease;
        }

        .spinner-dots.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner-dots span {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #ffe600;
            animation: dot-pulse 1.4s ease-in-out infinite;
        }

        .spinner-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .spinner-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes dot-pulse {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* Textos */
        .main-text {
            font-size: 24px;
            font-weight: 900;
            color: #1a1321;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            transition: all 0.3s ease;
        }

        .main-text.yellow {
            background: linear-gradient(135deg, #ffe600, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sub-text {
            font-size: 15px;
            color: #7a7380;
            font-weight: 500;
            margin-bottom: 4px;
            transition: all 0.3s ease;
            min-height: 24px;
        }

        .status-badge {
            display: inline-block;
            margin-top: 12px;
            padding: 5px 18px;
            border-radius: 100px;
            background: #fff8e1;
            font-size: 12px;
            font-weight: 700;
            color: #b8860b;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: all 0.4s ease;
        }

        .status-badge.complete {
            background: #ffe600;
            color: #333;
            animation: badge-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes badge-pop {
            0% { transform: scale(0.8); }
            100% { transform: scale(1); }
        }

        /* Progresso Circular - Amarelo */
        .progress-ring {
            width: 70px;
            height: 70px;
            margin: 20px auto 0;
            position: relative;
            transition: all 0.5s ease;
        }

        .progress-ring.complete {
            opacity: 0;
            transform: scale(0.8);
            pointer-events: none;
        }

        .progress-ring svg {
            transform: rotate(-90deg);
        }

        .progress-ring circle {
            fill: none;
            stroke-width: 4;
        }

        .progress-ring .bg {
            stroke: #fff3d6;
        }

        .progress-ring .fill {
            stroke: url(#yellowGradient);
            stroke-linecap: round;
            stroke-dasharray: 157.08;
            stroke-dashoffset: 157.08;
            transition: stroke-dashoffset 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .progress-ring .percent-text {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 800;
            color: #b8860b;
        }

        /* Área do Botão - Amarelo */
        .continue-area {
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 230, 0, 0.15);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            opacity: 0;
            transform: translateY(10px);
            pointer-events: none;
        }

        .continue-area.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .btn-continue {
            display: block;
            width: 100%;
            padding: 18px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, #ffe600, #ffd700);
            color: #333;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 800;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 24px rgba(255, 230, 0, 0.35);
            letter-spacing: 0.3px;
            position: relative;
            overflow: hidden;
        }

        .btn-continue::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }

        .btn-continue:hover::before {
            transform: translateX(100%);
        }

        .btn-continue:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(255, 230, 0, 0.45);
        }

        .btn-continue:active {
            transform: translateY(0);
        }

        .btn-hint {
            margin-top: 12px;
            font-size: 12px;
            color: #a89fb0;
            font-weight: 600;
        }

        /* Overlay */
        .redirect-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 252, 245, 0.97);
            backdrop-filter: blur(16px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
        }

        .redirect-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .redirect-spinner {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 4px solid #fff3d6;
            border-top-color: #ffe600;
            border-right-color: #ffd700;
            animation: spin 0.8s linear infinite;
        }

        .redirect-overlay p {
            font-size: 16px;
            color: #7a7380;
            font-weight: 700;
        }

        /* Responsivo */
        @media (max-width: 440px) {
            .container {
                padding: 36px 20px 32px;
                border-radius: 28px;
            }
            .spinner-wrapper {
                width: 90px;
                height: 90px;
            }
            .main-text {
                font-size: 20px;
            }
            .spinner-ring.complete::after {
                font-size: 38px;
            }
        }
    </style>
</head>
<body>

    <!-- Confetes Amarelos -->
    <div class="confetti-container" id="confettiContainer">
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
    </div>

    <!-- Container Principal -->
    <div class="container">
        <!-- Spinner -->
        <div class="spinner-wrapper">
            <div class="spinner-ring" id="spinnerRing"></div>
            <div class="spinner-dots" id="spinnerDots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <!-- Textos -->
        <h2 class="main-text" id="mainTitle">Processando</h2>
        <p class="sub-text" id="subText">Verificando suas informações...</p>
        
        <div class="status-badge" id="statusBadge">Aguardando</div>

        <!-- Progresso Circular -->
        <div class="progress-ring" id="progressRing">
            <svg width="70" height="70" viewBox="0 0 70 70">
                <defs>
                    <linearGradient id="yellowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ffe600"/>
                        <stop offset="100%" stop-color="#ffd700"/>
                    </linearGradient>
                </defs>
                <circle class="bg" cx="35" cy="35" r="25"/>
                <circle class="fill" id="progressCircle" cx="35" cy="35" r="25"/>
            </svg>
            <div class="percent-text" id="percentText">0%</div>
        </div>

        <!-- Botão -->
        <div class="continue-area" id="continueArea">
            <a href="/" class="btn-continue" id="continueBtn">Continuar →</a>
            <p class="btn-hint" id="btnHint">Clique para prosseguir</p>
        </div>
    </div>

    <!-- Overlay -->
    <div class="redirect-overlay" id="redirectOverlay">
        <div class="redirect-spinner"></div>
        <p>Encaminhando...</p>
    </div>

    <script>
        (function() {
            var progress = 0;
            var totalTime = 3200;
            var stepTime = 50;
            var targetUrl = '/';

            // DOM
            var mainTitle = document.getElementById('mainTitle');
            var subText = document.getElementById('subText');
            var statusBadge = document.getElementById('statusBadge');
            var progressCircle = document.getElementById('progressCircle');
            var percentText = document.getElementById('percentText');
            var progressRing = document.getElementById('progressRing');
            var spinnerRing = document.getElementById('spinnerRing');
            var spinnerDots = document.getElementById('spinnerDots');
            var continueArea = document.getElementById('continueArea');
            var continueBtn = document.getElementById('continueBtn');
            var btnHint = document.getElementById('btnHint');
            var redirectOverlay = document.getElementById('redirectOverlay');
            var confettiContainer = document.getElementById('confettiContainer');

            var circumference = 157.08;

            var phases = [
                { title: 'Verificando', sub: 'Analisando os dados recebidos...', status: 'Coleta' },
                { title: 'Processando', sub: 'Cruzando informações em nossa base...', status: 'Análise' },
                { title: 'Quase lá', sub: 'Preparando os resultados finais...', status: 'Finalizando' },
                { title: 'Concluído!', sub: 'Sua solicitação foi processada com sucesso.', status: 'Pronto' }
            ];

            function updateProgress(value) {
                var percent = Math.min(value, 100);
                var offset = circumference - (percent / 100) * circumference;
                progressCircle.style.strokeDashoffset = offset;
                percentText.textContent = percent + '%';
            }

            function getPhase(percent) {
                if (percent < 30) return phases[0];
                if (percent < 60) return phases[1];
                if (percent < 90) return phases[2];
                return phases[3];
            }

            updateProgress(0);

            var timer = setInterval(function() {
                progress += 1;
                var currentPercent = Math.min(progress, 100);

                updateProgress(currentPercent);

                var phase = getPhase(currentPercent);
                
                if (currentPercent < 100) {
                    mainTitle.textContent = phase.title;
                    subText.textContent = phase.sub;
                    statusBadge.textContent = phase.status;
                }

                if (currentPercent >= 100) {
                    clearInterval(timer);
                    
                    // Estado final
                    mainTitle.textContent = 'Concluído!';
                    mainTitle.classList.add('yellow');
                    subText.textContent = 'Sua solicitação foi processada com sucesso.';
                    statusBadge.textContent = 'Finalizado';
                    statusBadge.classList.add('complete');
                    
                    // Transforma o spinner em check
                    spinnerRing.classList.add('complete');
                    spinnerDots.classList.add('hidden');
                    progressRing.classList.add('complete');
                    
                    // Ativa os confetes
                    confettiContainer.style.display = 'block';
                    document.querySelectorAll('.confetti').forEach(function(el) {
                        el.style.animation = 'confetti-fall ' + (2.5 + Math.random() * 1.5) + 's linear forwards';
                        el.style.animationDelay = Math.random() * 1.5 + 's';
                    });
                    
                    // Mostra o botão
                    setTimeout(function() {
                        continueArea.classList.add('visible');
                    }, 600);
                }
            }, stepTime);

            // Evento do botão
            continueBtn.addEventListener('click', function(e) {
                e.preventDefault();
                redirectOverlay.classList.add('show');
                
                setTimeout(function() {
                    window.location.href = targetUrl + window.location.search;
                }, 1000);
            });

        })();
    </script>
</body>
</html>
